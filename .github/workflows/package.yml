name: Package Plugin

on:
  push:
    tags: [ '*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Install production dependencies
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader
      - name: Package installable plugin
        run: |
          mkdir -p build/simply-umami
          cp -R simply-umami.php inc css js vendor composer.json LICENSE.md readme.txt build/simply-umami/
          cd build
          zip -r simply-umami.zip simply-umami
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/simply-umami.zip

  wordpress:
    runs-on: ubuntu-latest
    needs: package
    if: vars.WORDPRESS_ORG_APPROVED == 'true' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Install production dependencies
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader
      - name: Deploy approved WordPress.org plugin
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: simply-umami
